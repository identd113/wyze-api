name: Bug report
description: Something in the wyze-api library does not work
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for the `wyze-api` library (login, device calls, camera streaming). If you use the Homebridge plugin, please report there unless you know the problem is in the library.

        Logs contain details that identify you or your network (device names, MAC and IP addresses, your Wi-Fi name, your email). Replace those with `REDACTED`. Never post your password, API key or tokens.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The calls you made, with example values.
      render: javascript
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and model code
      description: For example "Cam v3 (WYZE_CAKP2JFUS)". Leave blank if it is not about one device.

  - type: input
    id: version
    attributes:
      label: wyze-api version
      placeholder: "2.0.0-beta.3"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: "`node -v`"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I removed personal details and credentials from what I pasted.
          required: true
