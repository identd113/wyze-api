# Sync the in-repo wiki/ directory to the project's GitHub Wiki.
# Wikis live in a separate <repo>.wiki.git repository; this workflow keeps
# them in lockstep with what's committed under wiki/ on the 2.x branch.

name: Sync wiki

on:
  workflow_dispatch: {}
  push:
    branches: [2.x, 2.0.0]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wiki is a separate <repo>.wiki.git repository that GitHub only creates once the first page is made
      # in the repository's Wiki tab (and Wikis are on in Settings). Until then there is nothing to push to, and
      # the sync would fail on every push; this skips it with a notice instead, and it works by itself afterwards.
      - name: Is the wiki set up?
        id: wiki
        run: |
          if git ls-remote --exit-code "https://github.com/${{ github.repository }}.wiki.git" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The wiki repository does not exist yet. Turn on Wikis in Settings and create the first page in the Wiki tab, then run this workflow again."
          fi

      - name: Push wiki/ to GitHub Wiki
        if: steps.wiki.outputs.ready == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki/
